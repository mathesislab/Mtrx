[package]
name = "mtrx-format"
description = "Message formatting for Mtrx: Markdown and LaTeX to Matrix HTML, Matrix HTML to a document model, math rendering"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Typeset with Typst. Its fonts come with `typst-fonts` or `math-font`.
render = ["dep:idna_adapter", "dep:mitex", "dep:mitex-spec-gen", "dep:fxhash", "dep:memmap2", "dep:typst", "dep:typst-layout", "dep:typst-render", "dep:thiserror", "dep:unicode-segmentation"]
# All of Typst's fonts (9.6 MB): text, math and monospace (the desktop).
typst-fonts = ["render", "dep:typst-assets", "typst-assets/fonts"]
# Only the math font (1.2 MB, in `fonts/`), for formulas (the phones).
math-font = ["render"]

[dependencies]
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
ruma-html = { version = "0.9.0", features = ["matrix"] }
ruma-common = "0.20.0"
linkify = "0.10.0"
mitex = { version = "0.2.4", optional = true }
mitex-spec-gen = { version = "0.2.4", optional = true }
fxhash = { version = "0.2.1", optional = true }
memmap2 = { version = "0.9.11", optional = true }
typst = { version = "0.15.1", optional = true }
typst-layout = { version = "0.15.1", optional = true }
typst-render = { version = "0.15.1", optional = true }
typst-assets = { version = "0.15.1", optional = true }
thiserror = { workspace = true, optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }
# Typst turns on zerovec's `serde` feature, which makes ruma-common fail to
# compile (trait-solver overflow). idna_adapter 1.1 uses the unicode-rs backend
# instead of ICU, which keeps zerovec out of ruma-common's dependency graph.
idna_adapter = { version = "~1.1", optional = true }

[dev-dependencies]
png = "0.18"

[[example]]
name = "render"
required-features = ["typst-fonts"]
